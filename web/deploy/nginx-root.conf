# RAVERSTUHL at the root of its own domain: put web/dist/ into `root` and include this in `server { … }`.
# (For a subfolder like /raverstuhl/ see nginx-location.conf.)
location / {
    # MapLibre's worker is an ES module (.mjs); older nginx mime.types don't know the extension.
    types {
        text/html                 html;
        text/css                  css;
        application/javascript    js mjs;
        application/json          json;
        application/geo+json      geojson;
        image/png                 png;
        image/jpeg                jpg;
        image/svg+xml             svg;
        application/octet-stream  bin;
    }
    # The data files are raw binary/JSON; gzip roughly halves them in transit.
    gzip on;
    gzip_types application/javascript text/css application/json application/geo+json application/octet-stream image/svg+xml;
    gzip_min_length 1024;

    # Revalidate everything by default (cheap 304s), so a redeploy never mixes old and new data files.
    add_header Cache-Control "no-cache";

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
