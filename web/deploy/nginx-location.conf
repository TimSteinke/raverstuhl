# RAVERSTUHL as a static subfolder, e.g. https://example.org/raverstuhl/
# Copy web/dist/ to <webroot>/raverstuhl/ and include this inside your `server { … }` block.
# The page loads its files by relative URL, so it must be opened with the trailing slash.
location = /raverstuhl {
    absolute_redirect off;  # relative redirect: keeps host and port behind proxies
    return 301 /raverstuhl/;
}

location /raverstuhl/ {
    # MapLibre's worker is an ES module (.mjs); older nginx mime.types don't know the extension.
    types {
        text/html                 html;
        text/css                  css;
        application/javascript    js mjs;
        application/json          json;
        application/geo+json      geojson;
        image/png                 png;
        image/svg+xml             svg;
        application/octet-stream  bin;
    }
    # The data files are raw binary/JSON; gzip roughly halves them in transit.
    gzip on;
    gzip_types application/javascript text/css application/json application/geo+json application/octet-stream image/svg+xml;
    gzip_min_length 1024;

    location ~* /raverstuhl/(assets|data|vendor)/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
